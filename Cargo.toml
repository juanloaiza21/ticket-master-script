[package]
name = "ticketwatch"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ticketwatch"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line watcher: HTTP client, notifications, argument parsing.
cli = ["dep:clap", "dep:reqwest", "dep:chrono"]
# The browser build: build with `--no-default-features --features web` for wasm32.
web = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = { version = "0.2.129", optional = true }
